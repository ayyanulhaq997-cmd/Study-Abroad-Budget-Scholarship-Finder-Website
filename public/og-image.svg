    <!-- Feature 2 -->
    <rect x="265" y="0" width="240" height="110" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <circle cx="301" cy="36" r="16" fill="#10B981" fill-opacity="0.2" />
    <text x="294" y="42" font-family="sans-serif" font-size="18" fill="#34D399">🌍</text>
    <text x="289" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">6 Top Destinations</text>
    <text x="289" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Statutory Proof Benchmarks</text>

    <!-- Feature 3 -->
    <rect x="530" y="0" width="240" height="110" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <circle cx="566" cy="36" r="16" fill="#F59E0B" fill-opacity="0.2" />
    <text x="559" y="42" font-family="sans-serif" font-size="18" fill="#FBBF24">🎓</text>
    <text x="554" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Scholarship Finder</text>
    <text x="554" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Eligibility Matcher Engine</text>

    <!-- Feature 4 -->
    <rect x="795" y="0" width="240" height="110" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <circle cx="831" cy="36" r="16" fill="#6366F1" fill-opacity="0.2" />
    <text x="824" y="42" font-family="sans-serif" font-size="18" fill="#A5B4FC">🏛️</text>
    <text x="819" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">University Directory</text>
    <text x="819" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Verified Tuition &amp; Portals</text>
  </g>

  <!-- URL watermark -->
  <text x="1120" y="590" text-anchor="end" font-family="monospace" font-size="14" fill="#64748B">study-abroad-budget-scholarship-fin-ochre.vercel.app</text>
